<body id="page-top" data-spy="scroll" data-target=".navbar-fixed-top">

  <!-- Nautickraft: Scroll-Reveal + Navbar Scroll Effect -->
  <script>
    // Scroll-reveal: fade-up sections as they enter the viewport
    (function() {
      var revealSelectors = [
        '#about', '#services', '#portfolio', '#testimonials', '#team', '#contact'
      ];
      // Add initial hidden state via class immediately
      document.addEventListener('DOMContentLoaded', function() {
        revealSelectors.forEach(function(sel) {
          var el = document.querySelector(sel);
          if (el) el.classList.add('nk-reveal-hidden');
        });

        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.remove('nk-reveal-hidden');
              entry.target.classList.add('nk-reveal-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.08 });

        revealSelectors.forEach(function(sel) {
          var el = document.querySelector(sel);
          if (el) observer.observe(el);
        });

        // Navbar: add scrolled class for glass effect
        var navbar = document.getElementById('menu');
        window.addEventListener('scroll', function() {
          if (window.scrollY > 80) {
            navbar && navbar.classList.add('nk-scrolled');
          } else {
            navbar && navbar.classList.remove('nk-scrolled');
          }
        });
      });
    })();
  </script>
</body>
